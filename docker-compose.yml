version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: gametwenti-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gametwenti}
      POSTGRES_USER: ${POSTGRES_USER:-gametwenti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gametwenti123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gametwenti} -d ${POSTGRES_DB:-gametwenti}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - gametwenti-network

  # Backend + Frontend App
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gametwenti-app
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-gametwenti}:${POSTGRES_PASSWORD:-gametwenti123}@db:5432/${POSTGRES_DB:-gametwenti}?schema=public
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gametwenti-network

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

networks:
  gametwenti-network:
    driver: bridge
